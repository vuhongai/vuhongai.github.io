<!-- start custom head snippets -->

<!-- Cursor-adapted typography: Cormorant Garamond (hero) + EB Garamond (headings) + Lato (UI/body) -->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Lato:wght@400;600&display=swap" rel="stylesheet"/>

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

<!-- Force single light theme — no dark mode -->
<script>
  localStorage.setItem("theme", "light");
  document.documentElement.setAttribute("data-theme", "light");
</script>

<!-- AOS (Animate On Scroll) -->
<link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css"/>

<!-- AOS fail-safe -------------------------------------------------------
     aos.css (loaded above, after main.css) sets every [data-aos] element
     to opacity:0 and relies on the AOS JavaScript to reveal it on scroll.
     If that CDN script is slow, blocked, or misfires (e.g. it initialises
     after DOMContentLoaded has already fired, so above-the-fold elements
     never receive .aos-animate), the content stays invisible and the page
     looks blank. These rules make [data-aos] content visible
     unconditionally and provide a dependency-free CSS entrance animation,
     so the site can never render blank regardless of the AOS script. -->
<style>
  [data-aos] {
    opacity: 1 !important;
    transform: none !important;
    animation: aosEntrance 0.6s ease-out both;
  }
  @keyframes aosEntrance {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    [data-aos] { animation: none; }
  }
</style>

<!-- end custom head snippets -->
