name: Update Publications

on:
  # NOTE: the weekly schedule is intentionally disabled. The ORCID/Scholar
  # scraper pulled in conference abstracts, podcast episodes, author
  # corrections and duplicates with empty citations, which broke the
  # Publications page. _publications/ is now a hand-curated collection
  # (each file marked "# curated" so the script cannot overwrite it).
  # Re-enable the cron only after the script filters non-article work types.
  #
  # schedule:
  #   - cron: '0 6 * * 1'   # every Monday at 06:00 UTC
  workflow_dispatch:        # manual trigger only, from the Actions UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests scholarly

      - name: Run update script
        run: python scripts/update_publications.py

      - name: Commit new publications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _publications/
          git diff --cached --quiet || git commit -m "Auto-update publications from ORCID and Google Scholar"
          git push
